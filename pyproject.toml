[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "eu-ai-act-rag"
version = "0.1.0"
description = "Bilingual (FR/EN) RAG assistant over the EU AI Act and GDPR, with a documented retrieval ablation."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Manal Herradi" }]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Local multilingual models (multilingual-e5 embeddings + cross-encoder reranker). Pulls torch.
local = ["sentence-transformers>=3.0"]
# Postgres + pgvector vector store
pg = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
# Google Cloud: Gemini on Vertex AI, Vertex text-embedding, Vertex AI ranking API
vertex = ["google-genai>=1.0", "google-auth>=2.30"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
eval = ["matplotlib>=3.8"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-beautifulsoup4",
  "matplotlib>=3.8",
]

[project.scripts]
euai = "eu_ai_act_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eu_ai_act_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]  # legal texts contain typographic unicode

[tool.ruff.lint.per-file-ignores]
"tests/test_parser.py" = ["E501"]  # verbatim markup snippet

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
mypy_path = "src"
packages = ["eu_ai_act_rag"]

[[tool.mypy.overrides]]
module = [
  "sentence_transformers.*", "psycopg.*", "pgvector.*", "google.*", "anthropic.*",
  "openai.*", "matplotlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
