name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint, types, tests (offline)
    runs-on: ubuntu-latest
    env:
      # The suite must never need a secret: mock LLM, hashing embeddings, fixture corpus.
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: hashing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check src tests evals
      - run: mypy
      - run: pytest
      - name: offline ablation smoke run
        run: python evals/run_ablation.py --profile offline --out /tmp/eval-offline
      - uses: actions/upload-artifact@v4
        with:
          name: eval-offline
          path: /tmp/eval-offline

  ui:
    name: UI typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [python, ui]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/api.Dockerfile -t eu-ai-act-rag-api:ci .
      - run: docker build -f docker/ui.Dockerfile -t eu-ai-act-rag-ui:ci .
