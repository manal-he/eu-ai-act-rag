# LOCAL DEVELOPMENT ONLY: Postgres + pgvector, the API and the UI. Zero keys needed.
# Ports are bound to 127.0.0.1 and the database is not published at all; the credentials
# below are throwaway dev values. Production (deploy/cloudrun/) reads DATABASE_URL from
# Secret Manager and never uses these defaults.
#   docker compose up --build    ->  UI http://localhost:8080   API http://localhost:8000/docs
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag-local-only   # local development credential, not a secret
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      VECTOR_STORE: pgvector
      DATABASE_URL: postgresql://rag:rag-local-only@db:5432/rag
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "127.0.0.1:8000:8080"
    depends_on:
      db:
        condition: service_healthy
    # Mount the full corpus after `make ingest` and set CORPUS_PATH=/app/data/processed/corpus.jsonl
    volumes:
      - ./data/processed:/app/data/processed:ro

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api

volumes:
  pgdata:
